name: Build and Release APK
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > ${{ github.workspace }}/app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version info from build.gradle.kts
        id: version_info
        run: |
          V_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          V_NAME=$(grep 'versionName' app/build.gradle.kts | cut -d '"' -f 2)
          echo "Trovato Version Code: $V_CODE"
          echo "Trovato Version Name: $V_NAME"
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/TechnicalworkMateriali-v${{ steps.version_info.outputs.VERSION_NAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version_info.outputs.VERSION_NAME }}"
          body: |
            versionCode: ${{ steps.version_info.outputs.VERSION_CODE }}
            versionName: ${{ steps.version_info.outputs.VERSION_NAME }}

            Aggiornamento automatico TechnicalWork Materiali
          files: |
            app/build/outputs/apk/debug/TechnicalworkMateriali-v${{ steps.version_info.outputs.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
