name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

# FONDAMENTALE: Garantisce al workflow i permessi per creare la release su GitHub
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Estrazione unificata e sicura per file Kotlin DSL (.kts)
      - name: Read version info from build.gradle.kts
        id: version_info
        run: |
          # Trova la riga versionCode e prende solo i numeri
          V_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          # Trova la riga versionName e prende esattamente il testo tra le virgolette
          V_NAME=$(grep 'versionName' app/build.gradle.kts | cut -d '"' -f 2)
          
          # Stampa i valori nei log di GitHub per debugging visivo
          echo "Trovato Version Code: $V_CODE"
          echo "Trovato Version Name: $V_NAME"
          
          # Salva le variabili per gli step successivi
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/TechnicalworkMateriali-v${{ steps.version_info.outputs.VERSION_NAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version_info.outputs.VERSION_NAME }}"
          body: |
            **Aggiornamento automatico TechnicalWork Materiali**
            - **Versione:** ${{ steps.version_info.outputs.VERSION_NAME }}
            - **Build Code:** ${{ steps.version_info.outputs.VERSION_CODE }}
          files: |
            app/build/outputs/apk/debug/TechnicalworkMateriali-v${{ steps.version_info.outputs.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
